name: App Android (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installa e prepara
        run: |
          npm ci
          npx cap sync android
      - name: Compila l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rinomina
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LeMieFoto.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LeMieFoto-android
          path: LeMieFoto.apk
      - name: Pubblica nella pagina Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Le mie foto ${{ github.run_number }}
          body: Scarica LeMieFoto.apk dal telefono Android e aprilo per installare l'app.
          files: LeMieFoto.apk
